name: SkyLume checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check application JavaScript syntax
        run: node --check app.js
      - name: Verify required assets
        run: |
          test -f index.html
          test -f app.js
          test -f style.css
          test -f favicon.svg
