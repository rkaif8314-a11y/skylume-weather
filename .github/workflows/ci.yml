name: SkyLume checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: skylume-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check application JavaScript syntax
        run: node --check app.js
      - name: Validate weather dashboard HTML
        run: npx --yes html-validate index.html
      - name: Verify required assets
        run: |
          test -f index.html
          test -f app.js
          test -f style.css
          test -f favicon.svg
      - name: Check repository whitespace
        run: git diff --check
